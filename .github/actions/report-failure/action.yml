name: Report failure log to the pull request
description: >
  Posts the captured build log as a comment on the pull request. This exists because
  the environment where NOLX is developed cannot reach the runner's log storage, so
  without it a failed run is a bare "exit code 101" and nothing else.

runs:
  using: composite
  steps:
    - name: Post the captured log
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        JOB_NAME: ${{ github.job }}
      run: |
        set -u
        LOG=/tmp/job.log
        BODY=$(mktemp)

        {
          echo "### \`${JOB_NAME}\` failed"
          echo
          echo "Commit \`${GITHUB_SHA:0:8}\`."
          echo
          echo '```'
          if [ -s "$LOG" ]; then
            # Keep it under the comment limit; the head is the least useful part, so
            # drop that rather than the errors at the end.
            tail -c 60000 "$LOG"
          else
            echo "(no log was captured for this job)"
          fi
          echo '```'
        } > "$BODY"

        if [ -n "${PR_NUMBER:-}" ]; then
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$BODY"
        else
          echo "::warning::not a pull request; log follows"
          cat "$BODY"
          # Push-only work must remain diagnosable through the check-annotations API.
          # Raw runner log storage is not reachable from every development environment.
          if [ -s "$LOG" ]; then
            SUMMARY=$(mktemp)
            {
              grep -E 'RUN:|Traceback|File .*line |^AssertionError|^error:|^PANIC|^FAILED' "$LOG" | tail -12 | cut -c1-500 || true
              echo '--- captured log tail ---'
              tail -n 8 "$LOG" | cut -c1-500
            } | head -c 3500 > "$SUMMARY"
            python3 -c 'import pathlib,sys; t=pathlib.Path(sys.argv[1]).read_text(errors="replace"); print("::error title=Captured failure summary::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$SUMMARY"
            rm -f "$SUMMARY"
          fi
        fi
        rm -f "$BODY"
