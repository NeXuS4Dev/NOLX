name: tmp-fmt
on:
  push:
    branches: [arena/d71a2d5c-nolx]
    paths: ['.github/workflows/tmp-fmt.yml']
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/d71a2d5c-nolx
      - run: rustup component add rustfmt
      - run: cargo fmt --all
      - run: |
          git config user.name tmp-fmt
          git config user.email tmp-fmt@example.com
          git add -A
          git commit -m "tmp: cargo fmt output" || echo "nothing to format"
          git push origin HEAD:arena/d71a2d5c-nolx
