  network-multi:
    name: Multi-adapter network wire identity and lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU
        run: |
          sudo apt-get update 2>&1 | tail -1
          sudo apt-get install -y qemu-system-x86 2>&1 | tail -3
      - name: Build multi-adapter network test
        run: make kernel KERNEL_FEATURES=hal-driver-net-multi-test 2>&1 | tee /tmp/job.log
      - name: Verify independent adapters, shared INTx and captured public RX/TX
        run: python3 scripts/check-network-multi.py 2>&1 | tee -a /tmp/job.log
      - name: Build poisoned-line firmware INTx proof
        run: make kernel KERNEL_FEATURES=hal-driver-net-multi-test,hal-pci-intx-poison-test 2>&1 | tee -a /tmp/job.log
      - name: Verify ACPI routes without valid Interrupt Line bytes
        run: python3 scripts/check-network-multi.py --intx-routing-only 2>&1 | tee -a /tmp/job.log
      - name: Build disabled-link _SRS recovery proof
        run: make kernel KERNEL_FEATURES=hal-driver-net-multi-test,hal-pci-intx-poison-test,hal-pci-link-srs-test 2>&1 | tee -a /tmp/job.log
      - name: Verify _SRS link reprogramming restores captured e1000 traffic
        run: python3 scripts/check-network-multi.py --link-srs-only 2>&1 | tee -a /tmp/job.log
      - name: Build combined six-storage four-NIC fixture
        run: make kernel KERNEL_FEATURES=hal-driver-multi-test,hal-driver-net-multi-test 2>&1 | tee -a /tmp/job.log
      - name: Verify all ten devices together on Q35
        run: python3 scripts/check-network-multi.py --storage-fixture-only 2>&1 | tee -a /tmp/job.log
      - name: Build checked e1000 failed-controller recovery fixture
        run: make kernel KERNEL_FEATURES=hal-e1000-recovery-test 2>&1 | tee -a /tmp/job.log
      - name: Verify partial startup, shared-INTx remask quarantine and fresh captured peer traffic
        run: python3 scripts/check-e1000-recovery.py 2>&1 | tee -a /tmp/job.log
      - name: Build checked virtio-net failed-controller recovery fixture
        run: make kernel KERNEL_FEATURES=hal-virtio-net-recovery-test 2>&1 | tee -a /tmp/job.log
      - name: Verify modern/transitional partial startup and MSI-X recovery with captured traffic
        run: python3 scripts/check-virtio-net-recovery.py 2>&1 | tee -a /tmp/job.log
