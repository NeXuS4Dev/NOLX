  usb-hid:
    name: Native USB HID interrupts, lifecycle and DMA safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU
        run: |
          sudo apt-get update 2>&1 | tail -1
          sudo apt-get install -y qemu-system-x86 2>&1 | tail -3
      - name: Build default kernel
        run: make kernel 2>&1 | tee /tmp/job.log
      - name: Verify a machine without storage, USB or network controllers falls back cleanly
        run: python3 scripts/check-absent-devices.py 2>&1 | tee -a /tmp/job.log
      - name: Verify PC and Q35 boot-HID input, ring wrap and disconnect reclamation
        run: python3 scripts/check-usb-input.py 2>&1 | tee -a /tmp/job.log
      - name: Reject misleading interrupt proof logs
        run: python3 -m unittest discover -s scripts -p 'test_xhci_irq_checks.py' 2>&1 | tee -a /tmp/job.log
      - name: Build interrupt observer image
        run: make kernel KERNEL_FEATURES=hal-xhci-irq-test 2>&1 | tee -a /tmp/job.log
      - name: Verify full/high-speed HID, USB3 control, MSI routing and explicit polling fallbacks
        run: |
          python3 scripts/check-usb-input.py --interrupts 2>&1 | tee -a /tmp/job.log
          python3 scripts/check-usb-input.py --usb-version 1 --interrupts 2>&1 | tee -a /tmp/job.log
          python3 scripts/check-usb-input.py --superspeed-control --interrupts 2>&1 | tee -a /tmp/job.log
          python3 scripts/check-usb-input.py --interrupts --transport msi 2>&1 | tee -a /tmp/job.log
          python3 scripts/check-usb-input.py --transport polled 2>&1 | tee -a /tmp/job.log
          python3 scripts/check-usb-input.py --no-apic 2>&1 | tee -a /tmp/job.log
      - name: Build independent input-object observer image
        run: make kernel KERNEL_FEATURES=hal-input-object-test,hal-xhci-irq-test 2>&1 | tee -a /tmp/job.log
      - name: Verify independent readers, overflow resync and stale USB identities
        run: python3 scripts/check-usb-input.py --objects --interrupts 2>&1 | tee -a /tmp/job.log
      - name: Verify PS/2 through the same input-object API
        run: python3 scripts/check-ps2-input.py --objects 2>&1 | tee -a /tmp/job.log
      - name: Verify controller lifecycle, actual transfer STALL and fail-closed slot repair
        run: |
          for mode in lifecycle start-fault stop-fault recovery irq-start-fault transfer-fault; do
            make kernel KERNEL_FEATURES=hal-xhci-${mode}-test,hal-xhci-irq-test 2>&1 | tee -a /tmp/job.log
            python3 scripts/check-xhci-lifecycle.py --mode "$mode" --interrupts 2>&1 | tee -a /tmp/job.log
          done
      - name: Build interrupt-vector exhaustion fixture
        run: make kernel KERNEL_FEATURES=hal-xhci-exhaust-test 2>&1 | tee -a /tmp/job.log
      - name: Verify an exhausted xHCI vector pool is refused without a leak
        run: python3 scripts/check-xhci-lifecycle.py --mode exhaust 2>&1 | tee -a /tmp/job.log
      - name: Annotate USB serial logs on failure
        if: failure()
        run: |
          for log in build/input-usb-*.log build/input-xhci-lifecycle-*.log; do
            tr -cd '\11\12\40-\176' < "$log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | sed 's/^/::error::/' || true
          done
      - uses: ./.github/actions/report-failure
