name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The failure-log step below posts a comment on the pull request, because the
# environment where this project is developed cannot reach the runner's log storage.
permissions:
  contents: read
  pull-requests: write

# GitHub's default Linux shell is `bash -e {0}` -- NO pipefail. Every step below pipes its
# command through `tee` to capture the log, and without pipefail that pipe reports tee's
# exit status, which is always 0. Two runs of this workflow reported green while cargo was
# failing to compile. This is the fix for that.
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------- the checks that
  # need no Rust toolchain. They run first, and they catch the two hardest-to-debug
  # classes of bug here: a boot trampoline that does not link, and an on-disk layout
  # that silently moved.
  boot-layer:
    name: Boot layer (as, ld, python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain versions
        run: |
          as --version | head -1
          ld --version | head -1
          python3 --version
      - name: Assemble, link, and validate the Multiboot header
        run: make bootcheck 2>&1 | tee /tmp/job.log
      - name: Upload the linked image
        uses: actions/upload-artifact@v7
        with:
          name: nolx-bootcheck-elf
          path: build/nolx.bootcheck.elf
      - uses: ./.github/actions/report-failure
        if: failure()

  on-disk-format:
    name: NOLXFS layout (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generator must be idempotent
        run: |
          python3 tools/nolxfs-codegen/gen.py --check 2>&1 | tee /tmp/job.log
          python3 tools/nolxfs-codegen/test_layout.py 2>&1 | tee -a /tmp/job.log
      - name: Generated files are byte-identical after regeneration
        run: |
          python3 tools/nolxfs-codegen/gen.py 2>&1 | tee -a /tmp/job.log
          git diff --exit-code crates/nolxfs/src/on_disk_gen.rs include/nolxfs/nolxfs_format.h \
            2>&1 | tee -a /tmp/job.log
      - name: Conformance database is well-formed
        run: |
          python3 tools/conformance-report.py --check 2>&1 | tee -a /tmp/job.log
      - name: Conformance dashboard is up to date
        run: |
          python3 tools/conformance-report.py 2>&1 | tee -a /tmp/job.log
          git diff --exit-code docs/testing/CONFORMANCE.md 2>&1 | tee -a /tmp/job.log
      - uses: ./.github/actions/report-failure
        if: failure()

  # ---------------------------------------------------------------- Rust
  host-tests:
    name: Host tests (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate first, so a stale generated file cannot mask a failure
        run: python3 tools/nolxfs-codegen/gen.py 2>&1 | tee /tmp/job.log
      - name: cargo test
        run: cargo test --lib --bins 2>&1 | tee -a /tmp/job.log
      - name: cargo test (integration tests)
        run: cargo test --tests 2>&1 | tee -a /tmp/job.log
      - name: Report the test totals to the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -u
          [ -n "${PR_NUMBER:-}" ] || exit 0
          BODY=$(mktemp)
          {
            echo "### host test totals for \`${{ github.sha }}\`"
            echo
            echo '```'
            echo "--- per-target results ---"
            grep -E "^(     Running|   Doc-tests|test result:)" /tmp/job.log || echo "(none)"
            echo "--- every error ---"
            grep -E "^(error|warning)(\[|:)" /tmp/job.log | sort | uniq -c | sort -rn || echo "(none)"
            echo "--- full log ---"
            tail -c 55000 /tmp/job.log
            echo '```'
          } > "$BODY"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$BODY"
          rm -f "$BODY"
      - uses: ./.github/actions/report-failure
        if: failure()

  lint:
    name: fmt + clippy + unsafe audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check 2>&1 | tee /tmp/job.log
      - name: clippy, warnings are errors
        run: cargo clippy --all-targets -- -D warnings 2>&1 | tee -a /tmp/job.log
      - name: every unsafe block states its invariant
        run: scripts/check-unsafe.sh 2>&1 | tee -a /tmp/job.log
      - uses: ./.github/actions/report-failure
        if: failure()

  kernel:
    name: Kernel build (x86_64-unknown-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - name: Clippy the kernel for its own target
        # Each warning is also printed as an error annotation, so the lint shows on the run
        # without opening the log. The step still fails on any warning.
        run: |
          set +e
          cargo clippy --release --target x86_64-unknown-none -p nolx-kernel \
            --message-format=short --color never -- -D warnings > /tmp/clippy.txt 2>&1
          status=$?
          tee -a /tmp/job.log < /tmp/clippy.txt
          grep -v -E "^[[:space:]]*$|Checking |Compiling |Finished " /tmp/clippy.txt | head -60 | while IFS= read -r line; do echo "::error::$line"; done
          exit $status
      - name: Build the kernel
        run: make kernel 2>&1 | tee -a /tmp/job.log
      - name: Validate the resulting image
        run: python3 scripts/verify-multiboot.py build/nolx.elf 2>&1 | tee -a /tmp/job.log
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: nolx-kernel-elf
          path: build/nolx.elf
      - uses: ./.github/actions/report-failure
        if: failure()

  # ---------------------------------------------------------------- does it boot?
  #
  # The list below is the project's honest progress record: a marker is asserted when the
  # kernel emits it, and not before. M6 reaches ring 3: the same run carries the M5
  # kernel-thread round-robin, the M6 user-mode "hello world" T2 test, and the M7 I/O,
  # Cache Manager, VFS/filesystems, and ring-3 tmpfs read/write T2 tests.
  boot-smoke:
    name: QEMU boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU
        run: |
          sudo apt-get update 2>&1 | tail -1
          sudo apt-get install -y qemu-system-x86 2>&1 | tail -3
      - name: Build
        run: make kernel 2>&1 | tee /tmp/job.log
      - name: Inspect the kernel image
        run: |
          {
            echo "--- size ---"; ls -l build/nolx.elf
            echo "--- ELF header ---"; readelf -h build/nolx.elf
            echo "--- sections ---"; readelf -SW build/nolx.elf
            echo "--- key symbols ---"
            nm -n build/nolx.elf | grep -Ei "nolx_kernel_main|nolx_probe|__start32|long_mode_entry|_sbss|_ebss|_edata|_end" || true
            echo "--- first instructions of nolx_kernel_main ---"
            objdump -d --no-show-raw-insn build/nolx.elf | sed -n '/<nolx_probe>:/,/^$/p' | head -20 || true
            objdump -d --no-show-raw-insn build/nolx.elf | sed -n '/<nolx_kernel_main>:/,/^$/p' | head -20 || true
            echo "--- every out/in instruction in the image ---"
            objdump -d --no-show-raw-insn build/nolx.elf | grep -cE "\bout\b|\bin\b" || true
          } 2>&1 | tee -a /tmp/job.log
      - name: Boot and capture the serial log
        run: |
          set -o pipefail
          # The disk the virtio-blk probe reads: 1 MiB, with a known pattern at the start of
          # sector 0 and a GUID Partition Table with two partitions. See tools/make-test-disk.py.
          python3 tools/make-test-disk.py build/disk.img
          # The AHCI drive gets its own copy. QEMU locks an image that a drive opens for writing,
          # so a second drive on the same file would refuse to start.
          cp build/disk.img build/disk-sata.img
          # The NVMe namespace gets its own copy too, for the same reason.
          cp build/disk.img build/disk-nvme.img
          # 90 seconds: the boot also probes AHCI and NVMe controllers, and the markers after the
          # virtio work must still be reached before QEMU is stopped.
          timeout 90 qemu-system-x86_64 \
            -kernel build/nolx.elf \
            -m 512M -nographic -no-reboot \
            -drive file=build/disk.img,if=none,id=vd0,format=raw \
            -device virtio-blk-pci,drive=vd0 \
            -drive file=build/disk-sata.img,if=none,id=sata0,format=raw \
            -device ahci,id=ahci -device ide-hd,drive=sata0,bus=ahci.0 \
            -drive file=build/disk-nvme.img,if=none,id=nvme0,format=raw \
            -device nvme,drive=nvme0,serial=nolx0 \
            -device qemu-xhci,id=xhci -device usb-kbd,bus=xhci.0 \
            -netdev user,id=net0 -device e1000,netdev=net0 \
            | tee build/serial.log || true
          cat build/serial.log >> /tmp/job.log
      # The NOLXFS file, after a remount from the disk, must be the pattern the kernel wrote.
      # Then fsck.nolxfs checks the volume in the partition: a clean volume means the commit left a
      # consistent on-disk state, not only a file the kernel could read back from memory.
      - name: The NOLXFS volume holds the file and checks clean
        run: |
          set -e
          line=$(grep -Eo 'nolxfs file checksum.bin: 8192 bytes written, committed, mounted again, read back, crc32 0x[0-9a-f]{8} matches' build/serial.log | head -1 || true)
          if [ -z "$line" ]; then
            echo "the NOLXFS file did not verify after the remount"
            exit 1
          fi
          want=$(echo "$line" | grep -Eo '0x[0-9a-f]{8}')
          got=$(python3 -c "b=bytes((((i & 0xFF) * 7) & 0xFF) ^ ((((i >> 8) & 0xFF) * 131) & 0xFF) ^ 0xA5 for i in range(8192)); import zlib; print('0x%08x' % (zlib.crc32(b) & 0xffffffff))")
          echo "the kernel read back crc32 $want; the pattern it wrote has crc32 $got"
          if [ "$want" != "$got" ]; then
            echo "the file read back is not the pattern the kernel wrote"
            exit 1
          fi
          # The partition: LBA 40 for 1000 sectors, as the disk tool wrote it.
          dd if=build/disk.img of=build/volume.img bs=512 skip=40 count=1000 status=none
          cargo run -q -p fsck-nolxfs -- build/volume.img

      # The round trip wrote sectors 1600 to 1603 and the kernel printed their checksum. Here the
      # image file, as QEMU left it, is checksummed over the same sectors: a match means the
      # write reached the disk and was not only held in the device's cache.
      - name: The written sectors are on the disk image
        run: |
          set -e
          line=$(grep -Eo 'wrote 4 sectors at 1600, read back, crc32 0x[0-9a-f]{8} matches' build/serial.log | head -1 || true)
          if [ -z "$line" ]; then
            echo "the virtio round trip did not report a checksum"
            exit 1
          fi
          want=$(echo "$line" | grep -Eo '0x[0-9a-f]{8}')
          got=$(python3 -c "import zlib; d=open('build/disk.img','rb').read()[1600*512:1604*512]; print('0x%08x' % (zlib.crc32(d) & 0xffffffff))")
          echo "the kernel wrote crc32 $want; the disk image's sectors 1600 to 1603 have crc32 $got"
          if [ "$want" != "$got" ]; then
            echo "the disk image does not hold the data the kernel wrote"
            exit 1
          fi

      # The AHCI round trip wrote sectors 1600 to 1603 to the SATA copy of the disk. QEMU has
      # exited, so the copy is checksummed here and must match what the kernel wrote.
      - name: The AHCI written sectors are on the SATA disk copy
        run: |
          set -e
          line=$(grep -Eo 'ahci: wrote 4 sectors at 1600, read back, crc32 0x[0-9a-f]{8} matches' build/serial.log | head -1 || true)
          if [ -z "$line" ]; then
            echo "the AHCI round trip did not report a checksum"
            exit 1
          fi
          want=$(echo "$line" | grep -Eo '0x[0-9a-f]{8}')
          got=$(python3 -c "import zlib; d=open('build/disk-sata.img','rb').read()[1600*512:1604*512]; print('0x%08x' % (zlib.crc32(d) & 0xffffffff))")
          echo "the kernel wrote crc32 $want through AHCI; the SATA copy's sectors 1600 to 1603 have crc32 $got"
          if [ "$want" != "$got" ]; then
            echo "the SATA disk does not hold the data the kernel wrote"
            exit 1
          fi

      # The NVMe round trip wrote sectors 1600 to 1603 to the NVMe copy of the disk. QEMU has
      # exited, so the copy is checksummed here and must match what the kernel wrote.
      - name: The NVMe written sectors are on the NVMe disk copy
        run: |
          set -e
          line=$(grep -Eo 'nvme: wrote 4 sectors at 1600, read back, crc32 0x[0-9a-f]{8} matches' build/serial.log | head -1 || true)
          if [ -z "$line" ]; then
            echo "the NVMe round trip did not report a checksum"
            exit 1
          fi
          want=$(echo "$line" | grep -Eo '0x[0-9a-f]{8}')
          got=$(python3 -c "import zlib; d=open('build/disk-nvme.img','rb').read()[1600*512:1604*512]; print('0x%08x' % (zlib.crc32(d) & 0xffffffff))")
          echo "the kernel wrote crc32 $want through NVMe; the NVMe copy's sectors 1600 to 1603 have crc32 $got"
          if [ "$want" != "$got" ]; then
            echo "the NVMe disk does not hold the data the kernel wrote"
            exit 1
          fi

      # These are the markers the kernel actually reaches today. The list is the project's
      # honest progress record: a marker is added when the kernel emits it, not before.
      - name: Assert the boot markers
        run: |
          set -e
          for marker in \
            "NOLX: boot layer entered (32-bit protected mode)" \
            "NOLX: long mode entered" \
            "NOLX: calling nolx_kernel_main" \
            "NOLX: early exception handlers installed" \
            "NOLX: nolx_probe0 returned" \
            "NOLX: nolx_probe reached (Rust is callable)" \
            "NOLX: nolx_kernel_main entered" \
            "NOLX 0.1.0 starting" \
            "cpu: max leaf" \
            "gs-cpu=0" \
            "hal: GDT/TSS loaded; 256-entry IDT installed" \
            "hal: syscall/sysret fast path armed (STAR kernel 0x08/0x10, user 0x1b/0x23)" \
            "hal: 8259 PIC remapped to vectors 32..47; all IRQs masked" \
            "acpi: RSDP revision=" \
            "acpi: PM1a control block at 0x" \
            "acpi: S5 sleep type " \
            "hpet: counter enabled at" \
            "apic: x" \
            "apic: calibrated timer=" \
            "hal: timer fallback prepared at 100 Hz; source starts after kernel initialization" \
            "hal: active clock source=" \
            "wall-clock: CMOS RTC UTC epoch=" \
            "NOLX: hal online" \
            "mm: higher-half switch: image window at 0xffffffff80000000" \
            "NOLX: mm online" \
            "NOLX: frame allocator online" \
            "mm: numa:" \
            "obj: pool usage:" \
            "NOLX: kernel heap online" \
            "NOLX: kernel heap selftest:" \
            "NOLX: mm selftest: starting" \
            "NOLX: mm selftest: single-frame phase" \
            "NOLX: mm selftest: mixed-order phase" \
            "NOLX: mm selftest: complete" \
            "NOLX: address space selftest:" \
            "NOLX: objmgr online" \
            "obj: namespace: \\Device" \
            "NOLX: obj selftest: 1 object, 2 handles" \
            "NOLX: obj session selftest: sessions 0 and 1 are isolated" \
            "NOLX: obj private namespace selftest: boundaries enforced, isolated roots" \
            "NOLX: obj type callback selftest: create/open/parse/close/delete invoked" \
            "NOLX: srm selftest: 10 access checks (6 granted, 4 denied)" \
            "NOLX: process selftest: 2 processes, 2 address spaces, PEB/job metadata, thread context, isolated/inherited handles, token-checked open/deny, teardown returned resources" \
            "NOLX: executive scheduler prepared: BSP idle context, three kernel threads, 16 KiB stacks" \
            "io: 16 major codes" \
            "NOLX: io selftest: 2 drivers, 2 stacked devices, 3 IORBs (1 sync, 1 async completion port, 1 cancelled), unload busy->ok; audit ok" \
            "NOLX: cache selftest: 1 shared map, 2 copy-writes, 3 copy-reads, 2 read-ahead pages, lazy writer + MmFlushSection flushed 2 dirty pages; audit ok" \
            "NOLX: vfs selftest: mounted tmpfs(/), devfs(/dev), initrd(/initrd), nolxfs(/mnt/nolxfs); tmpfs write/read 32 bytes verified=true, devfs ok, initrd ok, nolxfs ok, nolxfs-m8 ok; audit ok" \
            "NOLX: io online" \
            "NOLX: round-robin T2:" \
            "NOLX: user mode T2: init spawned (pid 1), entering ring 3" \
            "hello: hello from ring 3" \
            "tmpfs: ring-3 read/write ok" \
            "init: child exited with status 42" \
            "NOLX: tmpfs T2: ring-3 open/write/lseek/read/close/unlink on /tmp/m7-check (28 bytes round-tripped, verified=true)" \
            "NOLX: init sequence complete, halting the boot processor" \
            "NOLX: timer reached 100 ticks; nominal 100 Hz"
          do
            if ! grep -qF "$marker" build/serial.log; then
              echo "missing boot marker: $marker"
              exit 1
            fi
          done
          if ! grep -Eq \
            'NOLX: round-robin T2: ABCABCABCABC complete: 3 kernel threads, 12 timer quanta, order verified=true' \
            build/serial.log; then
            echo "the three kernel threads did not produce the exact interleaved round-robin trace"
            exit 1
          fi
          if ! grep -qF \
            'NOLX: user mode T2: hello ran in ring 3, hello exited with status 42, init observed 42 and exited with status 42' \
            build/serial.log; then
            echo "the ring-3 hello world did not run to a parent-observed exit status 42"
            exit 1
          fi
          if ! grep -qF \
            'NOLX: tmpfs T2: ring-3 open/write/lseek/read/close/unlink on /tmp/m7-check (28 bytes round-tripped, verified=true)' \
            build/serial.log; then
            echo "the ring-3 tmpfs read/write round-trip did not complete cleanly"
            exit 1
          fi
          if grep -qF 'NOLX: user mode T2: FAIL' build/serial.log; then
            echo "the ring-3 test reported an evidence-chain failure"
            exit 1
          fi
          if ! grep -Eq \
            'mm: higher-half switch: .*identity map gone=true, direct map reachable=true, image window reachable=true' \
            build/serial.log; then
            echo "missing marker: the higher-half switch did not verify its own result"
            exit 1
          fi
          if ! grep -Eq 'hal: active clock source=(calibrated LAPIC|TSC deadline)' build/serial.log; then
            echo "the calibrated local-APIC timer was not selected"
            exit 1
          fi
          # The allocator's stress test has to have run *while the clock kept ticking*: the
          # tick count is the evidence that interrupts were live during the allocations,
          # and the audit is the evidence that the free lists survived them.
          if ! grep -Eq 'NOLX: mm selftest: complete: [0-9]+ operations, audit ok, ticks=[1-9][0-9]*' build/serial.log; then
            echo "the memory-manager stress test did not complete cleanly under interrupt load"
            exit 1
          fi
          # The heap has to have grown at least one region -- a single 256 KiB region cannot
          # satisfy the self test's largest request -- and has to have given every byte back.
          if ! grep -Eq \
            'NOLX: kernel heap selftest: [0-9]+ allocations, \+[1-9][0-9]* region\(s\) to [0-9]+ KiB, largest free [0-9]+ bytes, in use 0 -> 0 bytes, integrity ok' \
            build/serial.log; then
            echo "the kernel heap did not pass its self test"
            exit 1
          fi
          # The node list is the machine's memory described as nodes, and the zonelist is the
          # order allocations are served in: local first.
          if ! grep -Eq 'mm: numa: [1-9][0-9]* node\(s\), .*, zonelist \[0\]' build/serial.log; then
            echo "the NUMA node list was not built"
            exit 1
          fi
          # Device discovery: the legacy configuration ports were read and at least one function
          # answered. The summary line is the evidence; each function has its own `pci:` line.
          if ! grep -Eq 'pci: [1-9][0-9]* function\(s\), [0-9]+ bridge\(s\) refused' build/serial.log; then
            echo "PCI discovery did not report any function"
            exit 1
          fi
          # BAR sizing: the probe found at least one implemented BAR on a type-0 function, with a
          # decoded base and a power-of-two window size (the QEMU VGA device has BARs).
          if ! grep -Eq 'pci: [0-9a-f]{2}:[0-9a-f]{2}\.[0-7] bar[0-5] (io|mem32|mem64) 0x[0-9a-f]+ size 0x[0-9a-f]+' build/serial.log; then
            echo "PCI BAR sizing did not report any implemented BAR"
            exit 1
          fi
          # virtio block: the device was found, its features negotiated, queue 0 enabled, and
          # DRIVER_OK set; then sector 0 was read through the queue and matches the disk image.
          if ! grep -Eq 'virtio-blk: [0-9a-f]{2}:[0-9a-f]{2}\.[0-7] capacity [1-9][0-9]* sectors \([0-9]+ bytes\), queue size [0-9]+, driver ok' build/serial.log; then
            echo "the virtio block device did not reach driver ok"
            exit 1
          fi
          if ! grep -Eq 'virtio-blk: wrote 4 sectors at 1600, read back, crc32 0x[0-9a-f]{8} matches the written data' build/serial.log; then
            echo "the virtio round trip did not verify"
            exit 1
          fi
          # NOLXFS: the kernel wrote a file on the first partition's volume, committed, mounted
          # the volume again from the disk, and read the file back with the same checksum.
          if ! grep -Eq 'virtio-blk: nolxfs file checksum.bin: 8192 bytes written, committed, mounted again, read back, crc32 0x[0-9a-f]{8} matches the written data' build/serial.log; then
            echo "the NOLXFS file did not verify after the remount"
            exit 1
          fi
          # GPT: the header and its table pass the rules, and the two partitions the disk tool
          # wrote are printed with their LBA ranges and names.
          if ! grep -Fq 'virtio-blk: gpt: header and table verified, 2 partitions in use' build/serial.log; then
            echo "the GPT header and table did not verify"
            exit 1
          fi
          if ! grep -Fq 'virtio-blk: gpt partition 0: LBA 40-1039 (1000 sectors), name nolx-data' build/serial.log; then
            echo "the first GPT partition was not reported as the disk tool wrote it"
            exit 1
          fi
          if ! grep -Fq 'virtio-blk: gpt partition 1: LBA 1200-1299 (100 sectors), name nolx-log' build/serial.log; then
            echo "the second GPT partition was not reported as the disk tool wrote it"
            exit 1
          fi
          if ! grep -Fq 'virtio-blk: bound and started through nolx-df' build/serial.log; then
            echo "the virtio-blk driver did not bind and start through nolx-df"
            exit 1
          fi
          if ! grep -Fq 'ahci: bound and started through nolx-df' build/serial.log; then
            echo "the ahci driver did not bind and start through nolx-df"
            exit 1
          fi
          if ! grep -Fq 'nvme: bound and started through nolx-df' build/serial.log; then
            echo "the nvme driver did not bind and start through nolx-df"
            exit 1
          fi
          if ! grep -Fq 'virtio-blk: sector 0 read, status ok, first 16 bytes match the disk image' build/serial.log; then
            echo "the virtio block read did not return the disk image's sector 0"
            exit 1
          fi
          # AHCI: the same sector 0, read through a command slot on a SATA port the controller
          # found by its class code, from the same disk image.
          if ! grep -Eq 'ahci: [0-9a-f]{2}:[0-9a-f]{2}\.[0-9] abar 0x[0-9a-f]+, ports 0x[0-9a-f]+, port [0-9]+ is a SATA disk' build/serial.log; then
            echo "the AHCI controller and SATA port were not reported"
            exit 1
          fi
          if ! grep -Eq 'ahci: port [0-9]+ sector 0 read, status ok, first 16 bytes match the disk image' build/serial.log; then
            echo "the AHCI read did not return the disk image's sector 0"
            exit 1
          fi
          # AHCI round trip: the pattern written to sectors 1600 to 1603 reads back and is
          # checked by CRC-32 in the kernel. The checksum step below checks the copy on disk.
          if ! grep -Eq 'ahci: wrote 4 sectors at 1600, read back, crc32 0x[0-9a-f]{8} matches the written data' build/serial.log; then
            echo "the AHCI round trip did not verify"
            exit 1
          fi
          # NVMe: the controller found by its class code, the namespace it reports, sector 0 read
          # through an I/O queue, and the same CRC-32 round trip the other drivers run.
          if ! grep -Eq 'nvme: [0-9a-f]{2}:[0-9a-f]{2}\.[0-9] bar0 0x[0-9a-f]+, namespace 1: [0-9]+ sectors of 512 bytes' build/serial.log; then
            echo "the NVMe controller and namespace were not reported"
            exit 1
          fi
          if ! grep -Fq 'nvme: sector 0 read, status ok, first 16 bytes match the disk image' build/serial.log; then
            echo "the NVMe read did not return the disk image's sector 0"
            exit 1
          fi
          # NVMe completions arrive as MSI-X interrupts: every I/O command raised one on the
          # I/O queue's entry, and the count matches the number of commands submitted.
          if ! grep -Eq 'nvme: msi-x completion interrupts: ([1-9][0-9]*) of \1 I/O commands, vector 0x50' build/serial.log; then
            echo "the NVMe completions did not arrive as MSI-X interrupts, one per command"
            exit 1
          fi
          # virtio-blk completions arrive as MSI-X interrupts on vector 0x51, one per request.
          if ! grep -Eq 'virtio-blk: msi-x completion interrupts: ([1-9][0-9]*) of \1 requests, vector 0x51' build/serial.log; then
            echo "the virtio-blk completions did not arrive as MSI-X interrupts, one per request"
            exit 1
          fi
          if ! grep -Eq 'nvme: wrote 4 sectors at 1600, read back, crc32 0x[0-9a-f]{8} matches the written data' build/serial.log; then
            echo "the NVMe round trip did not verify"
            exit 1
          fi
          # xHCI: the controller found by its class code, reset to a halted state, and its root
          # ports reported. The keyboard CI attaches is on a root port, and its connection state is
          # printed but not asserted here.
          if ! grep -Eq 'xhci: [0-9a-f]{2}:[0-9a-f]{2}\.[0-9] bar0 0x[0-9a-f]+, version 0x[0-9a-f]+, [0-9]+ ports, [0-9]+ slots' build/serial.log; then
            echo "the xHCI controller was not reported"
            exit 1
          fi
          if ! grep -Fq 'xhci: controller reset, halted' build/serial.log; then
            echo "the xHCI controller was not reset to a halted state"
            exit 1
          fi
          if ! grep -Eq 'xhci: port [0-9]+ (connected|empty)' build/serial.log; then
            echo "the xHCI root ports were not reported"
            exit 1
          fi
          if ! grep -Eq 'xhci: [0-9]+ of [0-9]+ ports connected' build/serial.log; then
            echo "the xHCI port summary was not reported"
            exit 1
          fi
          # e1000: the controller found by its vendor and device ID, its MAC address read from
          # the EEPROM, a frame transmitted with its descriptor marked done, and the driver bound
          # and started through the driver framework.
          if ! grep -Eq 'e1000: [0-9a-f]{2}:[0-9a-f]{2}\.[0-9] bar0 0x[0-9a-f]+, mac ([0-9a-f]{2}:){5}[0-9a-f]{2}, link (up|down)' build/serial.log; then
            echo "the e1000 controller and its MAC address were not reported"
            exit 1
          fi
          if ! grep -Fq 'e1000: transmitted a 60-byte frame, descriptor done' build/serial.log; then
            echo "the e1000 transmit did not complete"
            exit 1
          fi
          if ! grep -Fq 'e1000: bound and started through nolx-df' build/serial.log; then
            echo "the e1000 driver was not bound and started through the framework"
            exit 1
          fi
          # ACPI sleep control: the FADT names the PM1a control port, and the DSDT names the S5
          # soft-off type. The kernel reads both and enters neither state.
          if ! grep -Eq 'acpi: PM1a control block at 0x[0-9a-f]+, DSDT at 0x[0-9a-f]+' build/serial.log; then
            echo "the FADT's PM1a control block and DSDT were not reported"
            exit 1
          fi
          if ! grep -Eq 'acpi: S5 sleep type [0-7], soft-off word would be 0x[0-9a-f]+, not entered' build/serial.log; then
            echo "the S5 sleep type was not read from the DSDT"
            exit 1
          fi
          # Block queues: every read and write the kernel issued went through a device's queue,
          # and each one completed. The count is at least one and the two numbers are equal.
          if ! grep -Eq 'blockdev: ([1-9][0-9]*) requests dispatched, \1 completed' build/serial.log; then
            echo "the block requests did not all go through the queues and complete"
            exit 1
          fi
          # MMIO windows: a device register range is mapped uncached through the window above the
          # direct map, and reads the same value as the direct map (the local APIC version).
          if ! grep -Eq 'mm: mmio: LAPIC 0x[0-9a-f]+ at 0x[0-9a-f]+: uncached=true, version 0x[0-9a-f]+ read through the window matches the direct map' build/serial.log; then
            echo "the MMIO window check did not pass"
            exit 1
          fi
          # The pools are charged by the code that consumes memory -- the heap takes the
          # nonpaged pool, page tables take the system PTE pool -- and the report is the
          # executive's view of the same numbers.
          if ! grep -Eq \
            'obj: pool usage: nonpaged pool [1-9][0-9]* KiB of [0-9]+ MiB \(peak [1-9][0-9]* KiB\);.*accounting ok' \
            build/serial.log; then
            echo "the pools were not charged and reported through the object manager"
            exit 1
          fi
          # Demand paging, copy on write, stack growth, and the refusals: the address-space
          # self test maps pages, resolves faults, and leaves the frame and table counts
          # exactly where it found them, or it panics.
          if ! grep -Eq \
            'NOLX: address space selftest: [2-9][0-9]* space\(s\), [0-9]+ VAD\(s\), [1-9][0-9]* fault cause\(s\) resolved \([1-9][0-9]* demand-zero, [1-9][0-9]* copy-on-write, [1-9][0-9]* stack growth\), [1-9][0-9]* refusal\(s\); [1-9][0-9]* page\(s\) mapped; free frames ([0-9]+) -> \1; page tables allocated ([0-9]+) -> ([0-9]+), released [0-9]+ -> [0-9]+; system PTE peak [1-9][0-9]* KiB; audit ok' \
            build/serial.log; then
            echo "the address-space self test did not complete cleanly"
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path

          log = Path("build/serial.log").read_text(errors="replace")
          base = re.search(r"wall-clock: CMOS RTC UTC epoch=(\d+)s", log)
          current = re.search(r"realtime=Some\((\d+)\) ns", log)
          if base is None or current is None or int(current.group(1)) <= int(base.group(1)) * 1_000_000_000:
              raise SystemExit("wall clock did not advance from its RTC/monotonic anchor")
          PY

      - name: Assert e1000 receive and interrupt delivery
        run: |
          grep -F 'e1000: received ARP reply from 10.0.2.2' build/serial.log
          grep -E 'descriptor recycled, INTx vector 0x(5[0-9a-f]|[6-9a-c][0-9a-f]|d[0-9a-f]), interrupts [1-9][0-9]*' build/serial.log

      - name: Assert AHCI MSI completions
        run: |
          grep -F 'ahci: MSI completion interrupts: 3 of 3 commands, vector 0x52' build/serial.log

      - name: Inject PS/2 keyboard and mouse input through QMP
        run: python3 scripts/check-ps2-input.py 2>&1 | tee -a /tmp/job.log

      - name: Exercise PCIe ECAM and legacy-only configuration
        run: scripts/check-pci-ecam.sh 2>&1 | tee -a /tmp/job.log

      - name: Exercise the PIC/PIT fallback without local APIC support
        run: scripts/check-hal-pit-fallback.sh 2>&1 | tee -a /tmp/job.log

      # Every marker above is asserted, so this is a summary rather than a confession.
      # It stays because the subsystem lines carry detail -- the memory map, the object
      # type count, the syscall count -- that is worth reading rather than just passing.
      - name: Report what the kernel said about itself
        run: |
          grep -E "^(multiboot|mm|obj|exec|psx|io):" build/serial.log || \
            echo "::warning::no subsystem reported in"
      - name: Assert nothing panicked
        run: |
          # `CPU exception` is the boot layer's own handler (boot/boot.S); the other two
          # come from Rust. All three mean the same thing: the image is not booting
          # cleanly, and a green run must not hide that.
          if grep -qE "PANIC|BUGCHECK|CPU exception" build/serial.log; then
            echo "the kernel reported a fault during boot:"
            cat build/serial.log
            exit 1
          fi
      - name: Exercise #PF and #GP handlers under QEMU
        run: scripts/check-hal-faults.sh 2>&1 | tee -a /tmp/job.log
      - name: Upload the serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: serial-log
          path: |
            build/serial.log
            build/hal-*.serial.log
            build/pci-*.serial.log
            build/input-*.serial.log
      # Posted on success as well as failure. The artifact above is the archive of
      # record, but it is not reachable from everywhere this project is developed; the
      # comment is.
      - uses: ./.github/actions/report-serial
        if: always()
      # Diagnostic: the serial log as one error annotation, newlines encoded, so a failed boot can be
      # read through the checks API. Runs only on failure.
      - name: Annotate the serial log on failure
        if: failure()
        run: |
          tr -cd '\11\12\40-\176' < build/serial.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | sed 's/^/::error::/' || true
      - uses: ./.github/actions/report-failure
        if: failure()

  # ---------------------------------------------------------------- T2 with each storage backend
