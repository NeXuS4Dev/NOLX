name: M9 fmt diagnostic (temporary)
on:
  push:
    branches: ["arena/d71a2d5c-nolx"]
permissions:
  contents: write
jobs:
  diff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arena/d71a2d5c-nolx
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: cargo fmt and clippy, commit the results for inspection
        run: |
          mkdir -p ci-diag
          cargo fmt --all -- --check > ci-diag/fmt-check.txt 2>&1 || true
          cargo fmt --all
          cargo clippy --all-targets -- -D warnings > ci-diag/clippy.txt 2>&1 || true
          echo "clippy exit: $(grep -c '^error' ci-diag/clippy.txt) error lines" >> ci-diag/summary.txt
          git config user.name "fmt-diagnostic"
          git config user.email "fmt-diagnostic@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -q -m "temporary: CI diagnostics (rustfmt, clippy)"
            git push -q origin HEAD:arena/d71a2d5c-nolx
          fi
