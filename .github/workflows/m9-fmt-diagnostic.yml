name: M9 fmt diagnostic (temporary)
on:
  push:
    branches: ["arena/d71a2d5c-nolx"]
permissions:
  contents: write
jobs:
  diff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arena/d71a2d5c-nolx
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: cargo fmt, commit the result for inspection
        run: |
          cargo fmt --all -- --check > /tmp/fmt-check.txt 2>&1 || true
          cargo fmt --all
          git config user.name "fmt-diagnostic"
          git config user.email "fmt-diagnostic@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to format"; else
            git commit -q -m "temporary: rustfmt output (diagnostic)"
            git push -q origin HEAD:arena/d71a2d5c-nolx
          fi
          git diff HEAD~1 --stat || true
