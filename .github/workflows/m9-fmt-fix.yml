name: M9 fmt fix (temporary)
on:
  workflow_dispatch:
  push:
    branches: ["arena/d71a2d5c-nolx"]
permissions:
  contents: write
jobs:
  fmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arena/d71a2d5c-nolx
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: cargo fmt, commit the result
        run: |
          cargo fmt --all
          git config user.name "fmt-fix"
          git config user.email "fmt-fix@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to format"; else
            git commit -q -m "M9 slice 22: rustfmt output"
            git push -q origin HEAD:arena/d71a2d5c-nolx
          fi
