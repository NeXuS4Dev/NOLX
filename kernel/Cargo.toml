[package]
name = "nolx-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The NOLX kernel: HAL, executive, and POSIX subsystem"
readme = "../README.md"
publish = false

# Fault injection is compiled only for the dedicated T2 exception-path checks. A normal
# image has neither probe and always enters the kernel's idle path after initialization.
[features]
default = []
hal-fault-test-pf = []
hal-fault-test-gp = []

# A single binary target. There is deliberately no lib target: the crate is `no_std` and
# cannot be built for a host test harness. Pure HAL layouts and calculations live in
# nolx-hal-core, which is part of the normal host-test suite.
[[bin]]
name = "nolx-kernel"
path = "src/main.rs"

[dependencies]
nolx-input-core = { path = "../crates/nolx-input-core" }
nolx-net-core = { path = "../crates/nolx-net-core" }
nolx-ahci-core = { path = "../crates/nolx-ahci-core" }
nolx-nvme-core = { path = "../crates/nolx-nvme-core" }
nolx-usb-core = { path = "../crates/nolx-usb-core" }
nolx-df-core = { path = "../crates/nolx-df-core" }
nolx-e1000-core = { path = "../crates/nolx-e1000-core" }
nolx-block-core = { path = "../crates/nolx-block-core" }
nolx-hal-core = { path = "../crates/nolx-hal-core" }
# The memory-management algorithms: buddy allocator, frame magazines, page-table
# arithmetic, VAD tree, commit accounting, and the kernel heap. `no_std`, no hardware
# access, and `forbid(unsafe_code)`, so all of it runs under `cargo test` on the host while
# the kernel reaches the same code through the traits it implements (`BlockStore`,
# `TableStore`) over the direct map.
nolx-mm-core = { path = "../crates/nolx-mm-core" }
# The handle-table and namespace rules the object manager applies at boot. `no_std`, safe.
nolx-obj-core = { path = "../crates/nolx-obj-core" }
# The host-tested process context that owns the address-space association, token, and handle
# table. Kernel-specific object headers and address-space storage wrap this core model.
nolx-exec-core = { path = "../crates/nolx-exec-core" }
nolx-types = { path = "../crates/nolx-types" }
# Bus discovery: PCI configuration-space logic, host-tested. The kernel supplies only the
# legacy port accesses (`hal::pci`).
nolx-pci-core = { path = "../crates/nolx-pci-core" }
# ACPI sleep-state rules: the FADT fields and the `_Sx_` lookup, host-tested.
nolx-power-core = { path = "../crates/nolx-power-core" }
nolx-virtio-core = { path = "../crates/nolx-virtio-core" }
nolx-vfs = { path = "../crates/nolx-vfs" }
nolxfs = { path = "../crates/nolxfs" }
