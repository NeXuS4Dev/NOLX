[workspace]
resolver = "2"
members = [
    "crates/nolx-types",
    "crates/nolx-hal-core",
    "crates/nolx-mm-core",
    "crates/nolx-obj-core",
    "crates/nolx-exec-core",
    "crates/nolx-syscall",
    "crates/nolxfs",
    "crates/nolx-vfs",
    "kernel",
    "tools/mkfs-nolxfs",
    "tools/fsck-nolxfs",
    "tools/nolxfs-dump",
]
# `cargo test` with no `-p` and no `--workspace` uses these. The kernel is deliberately
# excluded: it is a `no_std` binary with no host test harness, and its testable HAL,
# memory-management, Object Manager, and process-context rules live in separate core crates.
default-members = [
    "crates/nolx-types",
    "crates/nolx-hal-core",
    "crates/nolx-mm-core",
    "crates/nolx-obj-core",
    "crates/nolx-exec-core",
    "crates/nolx-syscall",
    "crates/nolxfs",
    "crates/nolx-vfs",
    "tools/mkfs-nolxfs",
    "tools/fsck-nolxfs",
    "tools/nolxfs-dump",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.80 was the floor while the kernel was HAL-only. The memory manager uses
# `u64::is_multiple_of` on the allocation paths, where writing `% size == 0` would be both
# slower to read and a Clippy warning under `-D warnings`; that method is stable from 1.87.
# The floor is set to 1.88, the toolchain the tree is verified with, rather than to the
# exact stabilisation release.
rust-version = "1.88"
license = "BSD-2-Clause"
repository = "https://github.com/NeXuS4Dev/NOLX"
authors = ["The NOLX Authors"]

# Deliberately no `panic = "abort"` in these profiles: `cargo test` needs unwinding on the
# host. The kernel's target (`x86_64-unknown-none`) already carries `panic-strategy:
# abort`, so kernel code is abort-only regardless of what is set here.
[profile.dev]
debug = true
overflow-checks = true

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.kernel]
inherits = "release"
opt-level = 2
lto = "fat"
codegen-units = 1
panic = "abort"
